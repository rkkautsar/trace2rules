[project]
name = "trace2rules"
version = "0.3.0"
description = "Mine coding-agent trajectories into evidence-backed AGENTS.md rules"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rakha Kanz Kautsar", email = "rkkautsar@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["agents", "coding-agents", "agents.md", "trajectories", "duckdb"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "duckdb>=2.0.0",
    "pydantic>=2.14.3",
    "rich>=15.0.0",
    "typer>=0.29.1",
    "agent-trajectory>=0.4.4",
]

[project.urls]
Homepage = "https://github.com/rkkautsar/trace2rules"
Repository = "https://github.com/rkkautsar/trace2rules"
Issues = "https://github.com/rkkautsar/trace2rules/issues"

[project.scripts]
trace2rules = "trace2rules.cli:app"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
